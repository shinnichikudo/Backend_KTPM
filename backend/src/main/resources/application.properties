spring.profiles.active=local
spring.application.name=booking-service

# JWT
jwt.secret=${JWT_SECRET:day_la_chuoi_bi_mat_ao_chi_dung_de_chay_tam_local_tren_may_toi_1234567890}
jwt.expiration-ms=86400000

# Database chung (Đọc từ biến môi trường hoặc ghi đè từ application-local.properties)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:booking_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Admin credentials mặc định để trống (ghi đè từ application-local.properties hoặc env)
APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL:}
APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:}