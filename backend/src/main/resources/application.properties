spring.application.name=booking-service
# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:booking_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${APP_DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
# Secret phải >= 256 bit (32 ký tự) cho HS256
jwt.secret=booking-service-secret-key-change-in-prod-2026
jwt.expiration-ms=86400000

# Server
server.port=8080
